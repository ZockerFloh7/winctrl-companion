<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinCtrl</title><link rel="icon" type="image/png" href="/static/favicon.png"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/feature_ui.css?v=2"></head><body><script>window.adminKey={{ admin_key|tojson }};</script><script src="/static/ui.js"></script><header><h1>{{ action.name }}</h1><button class="primary" onclick="saveBlockly(this)">Speichern</button><div class="header-input-badge"><input id="scriptTimeout" type="text" inputmode="numeric" placeholder="timeout" value="{{ action.timeout_minutes if action.timeout_minutes is not none else '' }}" title="Timeout in ganzen Minuten (leer = 1 Min)"></div><button id="toggleRunBtn" class="btn-play" onclick="handlePlayStop(this)"><span class="icon-play"></span><span class="btn-text">Testlauf</span></button><span id="testStatus">Bereit</span><button class="history-button" onclick="workspace.undo(false)" title="Rückgängig" aria-label="Rückgängig">&#8630;</button><button class="history-button" onclick="workspace.undo(true)" title="Wiederholen" aria-label="Wiederholen">&#8631;</button><button onclick="discardChanges()">Verwerfen</button><button onclick="exportBlockly()">Export</button><button onclick="document.getElementById('workspaceImport').click()">Import</button><input id="workspaceImport" type="file" accept=".json" hidden><a class="button" href="/">Zurück</a></header><main style="padding:12px;max-width:none"><div id="blocklyDiv"></div><section class="card" style="margin-top:12px"><div class="toolbar"><strong>Ausführungsprotokoll</strong><span id="runId" class="muted"></span><label style="margin:0"><input id="autoScroll" type="checkbox" checked> Automatisch scrollen</label><button onclick="clearRunLog()">Ansicht leeren</button><button onclick="toggleLog()">Ein-/ausklappen</button></div><div id="runLog" role="log" aria-live="off"></div></section></main><script>window.actionData={{ action|tojson }};</script><script src="https://unpkg.com/blockly@11.2.2/blockly.min.js"></script><script src="https://unpkg.com/blockly@11.2.2/msg/de.js"></script><script src="/static/editor.js"></script><script>window.winctrlLogoUrl="/static/logo.png";</script><script src="/static/feature_ui.js?v=2"></script></body></html>
